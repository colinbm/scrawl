[package]
name = "scrawl-render"
description = "Renders Scrawl documents into Vello scenes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image.workspace = true
png = "0.18"
pollster = "0.4"
svg2pdf.workspace = true
# The same usvg svg2pdf uses, with text (so SVG text imports) and system fonts.
usvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }
scrawl-core.workspace = true
scrawl-text.workspace = true
vello.workspace = true
# Rasterizes SVG without the GPU: the app icon, and checking SVG output in tests.
resvg = { version = "0.45.1", default-features = false, features = ["raster-images"] }

[dev-dependencies]
