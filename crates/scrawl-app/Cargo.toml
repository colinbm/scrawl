[package]
name = "scrawl-app"
description = "Scrawl desktop vector editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "scrawl"
path = "src/main.rs"

[dependencies]
scrawl-core.workspace = true
scrawl-text.workspace = true
scrawl-render.workspace = true
vello.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
rfd.workspace = true
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
serde_json.workspace = true
log.workspace = true
png.workspace = true
image.workspace = true
env_logger.workspace = true
serde.workspace = true
uuid.workspace = true
rquickjs = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSDate", "NSError", "NSEnumerator", "NSFileVersion", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDocumentController", "NSResponder", "NSWindow"] }
arboard = { version = "3", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot", "eframe"] }
